<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 480" width="100%" height="100%">
  <defs>
    <linearGradient id="akGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F8FAFC"/>
      <stop offset="100%" stop-color="#EFF6FF"/>
    </linearGradient>
    <pattern id="akGrid" width="36" height="36" patternUnits="userSpaceOnUse">
      <path d="M 36 0 L 0 0 0 36" fill="none" stroke="#E2E8F0" stroke-width="0.7"/>
      <circle cx="0" cy="0" r="1.5" fill="#CBD5E1"/>
    </pattern>
  </defs>

  <!-- Canvas Background -->
  <rect width="900" height="480" fill="url(#akGrad)"/>
  <rect width="900" height="480" fill="url(#akGrid)" opacity="0.65"/>

  <!-- Border & Technical Framing -->
  <rect x="24" y="24" width="852" height="432" rx="12" fill="none" stroke="#CBD5E1" stroke-width="1.2"/>
  
  <!-- Technical Coordinate Marks -->
  <path d="M 24 38 L 38 38 M 38 24 L 38 38" stroke="#2563EB" stroke-width="2"/>
  <path d="M 876 38 L 862 38 M 862 24 L 862 38" stroke="#2563EB" stroke-width="2"/>
  <path d="M 24 442 L 38 442 M 38 456 L 38 442" stroke="#2563EB" stroke-width="2"/>
  <path d="M 876 442 L 862 442 M 862 456 L 862 442" stroke="#2563EB" stroke-width="2"/>

  <!-- Top Metadata Bar -->
  <g transform="translate(48, 52)">
    <text x="0" y="0" font-family="monospace" font-size="11" font-weight="700" fill="#2563EB" letter-spacing="1.5">AEROKART // CONCEPTUAL LOGISTICS SCHEMATIC</text>
    <text x="0" y="18" font-family="monospace" font-size="9" fill="#64748B">LONG-TERM VISION // EXPLORING DRONES, IOT SENSORS, CLOUD &amp; AI FOR LAST-MILE DELIVERY</text>
    <text x="804" y="0" font-family="monospace" font-size="10" font-weight="600" fill="#0F172A" text-anchor="end">STATUS: CONCEPT &amp; LEARNING GOAL</text>
  </g>

  <!-- Waypoint Route Curve -->
  <!-- Start Point (Origin Fulfillment Hub) -->
  <g transform="translate(100, 340)">
    <circle cx="0" cy="0" r="28" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1.5"/>
    <circle cx="0" cy="0" r="18" fill="#EFF6FF" stroke="#3B82F6" stroke-width="1.5"/>
    <circle cx="0" cy="0" r="6" fill="#2563EB"/>
    
    <!-- Tag -->
    <rect x="-60" y="36" width="120" height="42" rx="6" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1"/>
    <text x="0" y="52" font-family="monospace" font-size="10" font-weight="700" fill="#0F172A" text-anchor="middle">NODE 01: HUB</text>
    <text x="0" y="68" font-family="sans-serif" font-size="9" fill="#64748B" text-anchor="middle">Dispatch &amp; Takeoff</text>
  </g>

  <!-- Flight Path Spline -->
  <path d="M 100 340 C 180 180, 290 140, 390 200 S 580 320, 680 170" fill="none" stroke="#2563EB" stroke-width="2.5" stroke-dasharray="6,4"/>

  <!-- Midpoint Waypoint 01 (Ascent & Vector Lock) -->
  <g transform="translate(390, 200)">
    <circle cx="0" cy="0" r="14" fill="#FFFFFF" stroke="#3B82F6" stroke-width="1.5"/>
    <circle cx="0" cy="0" r="4" fill="#2563EB"/>
    
    <rect x="-60" y="-55" width="120" height="38" rx="6" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1"/>
    <text x="0" y="-39" font-family="monospace" font-size="9" font-weight="700" fill="#0F172A" text-anchor="middle">WAYPOINT CORRIDOR</text>
    <text x="0" y="-24" font-family="sans-serif" font-size="8.5" fill="#64748B" text-anchor="middle">Autonomous Flight Path</text>
    
    <!-- Coordinate crosshair -->
    <line x1="-18" y1="0" x2="-6" y2="0" stroke="#94A3B8" stroke-width="1"/>
    <line x1="6" y1="0" x2="18" y2="0" stroke="#94A3B8" stroke-width="1"/>
    <line x1="0" y1="-18" x2="0" y2="-6" stroke="#94A3B8" stroke-width="1"/>
    <line x1="0" y1="6" x2="0" y2="18" stroke="#94A3B8" stroke-width="1"/>
  </g>

  <!-- UAV In-Flight Drone Icon / Geometric Vector -->
  <g transform="translate(530, 255)">
    <!-- Radar range circle -->
    <circle cx="0" cy="0" r="38" fill="rgba(37,99,235,0.04)" stroke="#3B82F6" stroke-width="1" stroke-dasharray="3,3"/>
    
    <!-- Quadcopter Airframe Wireframe -->
    <circle cx="0" cy="0" r="10" fill="#2563EB"/>
    <!-- Arms -->
    <line x1="-22" y1="-22" x2="22" y2="22" stroke="#0F172A" stroke-width="2"/>
    <line x1="-22" y1="22" x2="22" y2="-22" stroke="#0F172A" stroke-width="2"/>
    <!-- Rotors -->
    <circle cx="-22" cy="-22" r="8" fill="none" stroke="#2563EB" stroke-width="1.5"/>
    <circle cx="22" cy="22" r="8" fill="none" stroke="#2563EB" stroke-width="1.5"/>
    <circle cx="-22" cy="22" r="8" fill="none" stroke="#2563EB" stroke-width="1.5"/>
    <circle cx="22" cy="-22" r="8" fill="none" stroke="#2563EB" stroke-width="1.5"/>

    <!-- Telemetry Readout Box -->
    <rect x="36" y="-30" width="145" height="58" rx="6" fill="#0F172A"/>
    <text x="46" y="-14" font-family="monospace" font-size="8.5" font-weight="700" fill="#38BDF8">CONCEPT ARCHITECTURE</text>
    <text x="46" y="-1" font-family="sans-serif" font-size="8.5" fill="#F1F5F9">Exploring: PX4 &amp; ArduPilot</text>
    <text x="46" y="12" font-family="sans-serif" font-size="8.5" fill="#F1F5F9">Curious: ROS &amp; Computer Vision</text>
    <text x="46" y="24" font-family="sans-serif" font-size="8.5" fill="#4ADE80">Goal: Safe Last-Mile Delivery</text>
  </g>

  <!-- Destination Landing Zone (Terminal Delivery Node) -->
  <g transform="translate(680, 170)">
    <circle cx="0" cy="0" r="32" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1.5"/>
    <circle cx="0" cy="0" r="22" fill="#ECFDF5" stroke="#10B981" stroke-width="1.5"/>
    <circle cx="0" cy="0" r="12" fill="#FFFFFF" stroke="#059669" stroke-width="1.5"/>
    <!-- 'H' Helipad Marker -->
    <text x="0" y="5" font-family="sans-serif" font-size="14" font-weight="900" fill="#059669" text-anchor="middle">H</text>

    <!-- Tag -->
    <rect x="-65" y="42" width="130" height="42" rx="6" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1"/>
    <text x="0" y="58" font-family="monospace" font-size="10" font-weight="700" fill="#0F172A" text-anchor="middle">NODE 03: DROP POINT</text>
    <text x="0" y="74" font-family="sans-serif" font-size="9" fill="#059669" text-anchor="middle">Marker Landing Concept</text>
  </g>

  <!-- Bottom Architecture Layer Pills -->
  <g transform="translate(48, 410)">
    <rect x="0" y="0" width="185" height="26" rx="4" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1"/>
    <text x="92" y="17" font-family="monospace" font-size="9" fill="#475569" text-anchor="middle">01. AUTOPILOT CONCEPTS</text>

    <rect x="200" y="0" width="185" height="26" rx="4" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1"/>
    <text x="292" y="17" font-family="monospace" font-size="9" fill="#475569" text-anchor="middle">02. VISION &amp; PERCEPTION GOALS</text>

    <rect x="400" y="0" width="185" height="26" rx="4" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1"/>
    <text x="492" y="17" font-family="monospace" font-size="9" fill="#475569" text-anchor="middle">03. SENSOR &amp; IOT EXPERIMENTS</text>

    <rect x="600" y="0" width="204" height="26" rx="4" fill="#EFF6FF" stroke="#BFDBFE" stroke-width="1"/>
    <text x="702" y="17" font-family="monospace" font-size="9" font-weight="600" fill="#2563EB" text-anchor="middle">04. WEB &amp; CLOUD COORDINATION</text>
  </g>
</svg>
