<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F8FAFC"/>
      <stop offset="100%" stop-color="#EFF6FF"/>
    </linearGradient>
    <linearGradient id="blueGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2563EB"/>
      <stop offset="100%" stop-color="#1D4ED8"/>
    </linearGradient>
    <pattern id="gridPattern" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#E2E8F0" stroke-width="1"/>
    </pattern>
  </defs>

  <!-- Background -->
  <rect width="800" height="500" fill="url(#bgGrad)"/>
  <rect width="800" height="500" fill="url(#gridPattern)" opacity="0.6"/>

  <!-- Top System Bar -->
  <rect x="40" y="30" width="720" height="44" rx="8" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1.5"/>
  <circle cx="65" cy="52" r="5" fill="#EF4444"/>
  <circle cx="85" cy="52" r="5" fill="#F59E0B"/>
  <circle cx="105" cy="52" r="5" fill="#10B981"/>
  <text x="140" y="57" font-family="monospace" font-size="12" fill="#64748B">AGRILINK // STUDENT PROJECT CONCEPT &amp; PROTOTYPE</text>
  <rect x="630" y="42" width="110" height="20" rx="4" fill="#EFF6FF" stroke="#BFDBFE" stroke-width="1"/>
  <text x="685" y="56" font-family="monospace" font-size="10" font-weight="600" fill="#2563EB" text-anchor="middle">EARLY PROTOTYPE</text>

  <!-- Flow Diagram: Farmer -> Match Concept -> Logistics -> Buyer -->
  <!-- Node 1: Producer / Farmer -->
  <g transform="translate(60, 130)">
    <rect width="180" height="150" rx="10" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1.5"/>
    <rect x="15" y="15" width="40" height="40" rx="8" fill="#ECFDF5" stroke="#A7F3D0" stroke-width="1"/>
    <path d="M35 25 L35 45 M25 35 L45 35" stroke="#059669" stroke-width="2" stroke-linecap="round"/>
    <text x="65" y="32" font-family="sans-serif" font-size="13" font-weight="700" fill="#0F172A">Farmers &amp; FPOs</text>
    <text x="65" y="48" font-family="monospace" font-size="10" fill="#64748B">Direct Listing</text>
    
    <line x1="15" y1="70" x2="165" y2="70" stroke="#F1F5F9" stroke-width="1"/>
    
    <text x="15" y="95" font-family="sans-serif" font-size="11" fill="#475569">Crop Availability</text>
    <text x="15" y="115" font-family="sans-serif" font-size="11" fill="#475569">Local Market Prices</text>
    <text x="15" y="135" font-family="monospace" font-size="10" fill="#059669">Goal: Fair Value</text>
  </g>

  <!-- Connective Route 1 -->
  <path d="M240 205 L310 205" stroke="#2563EB" stroke-width="2" stroke-dasharray="4,4"/>
  <polygon points="310,201 318,205 310,209" fill="#2563EB"/>

  <!-- Node 2: Match Engine Concept (Center Core) -->
  <g transform="translate(320, 100)">
    <rect width="160" height="210" rx="12" fill="#FFFFFF" stroke="#3B82F6" stroke-width="2"/>
    <rect x="0" y="0" width="160" height="36" rx="10" fill="url(#blueGrad)"/>
    <text x="80" y="23" font-family="sans-serif" font-size="12" font-weight="700" fill="#FFFFFF" text-anchor="middle">MATCHING CONCEPT</text>
    
    <!-- Central pulse indicator -->
    <circle cx="80" cy="75" r="24" fill="#EFF6FF" stroke="#BFDBFE" stroke-width="1.5"/>
    <circle cx="80" cy="75" r="14" fill="#DBEAFE"/>
    <circle cx="80" cy="75" r="6" fill="#2563EB"/>

    <text x="80" y="125" font-family="monospace" font-size="10" font-weight="600" fill="#1E40AF" text-anchor="middle">LEARNING PROJECT</text>
    <text x="80" y="145" font-family="sans-serif" font-size="10" fill="#64748B" text-anchor="middle">Exploring TypeScript</text>
    <text x="80" y="165" font-family="sans-serif" font-size="10" fill="#64748B" text-anchor="middle">Practicing APIs &amp; UI</text>

    <rect x="20" y="175" width="120" height="22" rx="4" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1"/>
    <text x="80" y="190" font-family="monospace" font-size="9" fill="#0F172A" text-anchor="middle">Tech: TypeScript</text>
  </g>

  <!-- Connective Route 2 -->
  <path d="M480 205 L550 205" stroke="#2563EB" stroke-width="2" stroke-dasharray="4,4"/>
  <polygon points="550,201 558,205 550,209" fill="#2563EB"/>

  <!-- Node 3: Buyers & Distribution -->
  <g transform="translate(560, 130)">
    <rect width="180" height="150" rx="10" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1.5"/>
    <rect x="15" y="15" width="40" height="40" rx="8" fill="#EFF6FF" stroke="#BFDBFE" stroke-width="1"/>
    <circle cx="35" cy="35" r="10" fill="none" stroke="#2563EB" stroke-width="2"/>
    <text x="65" y="32" font-family="sans-serif" font-size="13" font-weight="700" fill="#0F172A">Buyers &amp; Markets</text>
    <text x="65" y="48" font-family="monospace" font-size="10" fill="#64748B">Direct Connection</text>
    
    <line x1="15" y1="70" x2="165" y2="70" stroke="#F1F5F9" stroke-width="1"/>
    
    <text x="15" y="95" font-family="sans-serif" font-size="11" fill="#475569">Browse Farm Listings</text>
    <text x="15" y="115" font-family="sans-serif" font-size="11" fill="#475569">Simplified Sourcing</text>
    <text x="15" y="135" font-family="monospace" font-size="10" fill="#2563EB">Reduced Intermediaries</text>
  </g>

  <!-- Bottom Panel -->
  <g transform="translate(60, 340)">
    <rect width="680" height="110" rx="10" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1.5"/>
    
    <g transform="translate(30, 25)">
      <text x="0" y="14" font-family="monospace" font-size="10" fill="#64748B">PROJECT IDEA</text>
      <text x="0" y="38" font-family="sans-serif" font-size="15" font-weight="700" fill="#0F172A">Connecting Farmers</text>
      <text x="0" y="58" font-family="sans-serif" font-size="11" fill="#64748B">Exploring how software can simplify supply chains</text>
    </g>

    <line x1="240" y1="20" x2="240" y2="90" stroke="#E2E8F0" stroke-width="1"/>

    <g transform="translate(270, 25)">
      <text x="0" y="14" font-family="monospace" font-size="10" fill="#64748B">LEARNING GOAL</text>
      <text x="0" y="38" font-family="sans-serif" font-size="15" font-weight="700" fill="#0F172A">TypeScript Practice</text>
      <text x="0" y="58" font-family="sans-serif" font-size="11" fill="#64748B">Building structured models and components</text>
    </g>

    <line x1="480" y1="20" x2="480" y2="90" stroke="#E2E8F0" stroke-width="1"/>

    <g transform="translate(510, 25)">
      <text x="0" y="14" font-family="monospace" font-size="10" fill="#64748B">STATUS</text>
      <text x="0" y="38" font-family="sans-serif" font-size="15" font-weight="700" fill="#0F172A">Early Exploration</text>
      <text x="0" y="58" font-family="sans-serif" font-size="11" fill="#64748B">Ongoing student experiment</text>
    </g>
  </g>
</svg>
