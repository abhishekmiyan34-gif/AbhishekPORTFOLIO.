<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <defs>
    <linearGradient id="cssGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F8FAFC"/>
      <stop offset="100%" stop-color="#F1F5F9"/>
    </linearGradient>
    <pattern id="diag" width="20" height="20" patternUnits="userSpaceOnUse">
      <path d="M 0 20 L 20 0 M 0 0 L 20 20" stroke="#E2E8F0" stroke-width="0.5"/>
    </pattern>
  </defs>

  <rect width="800" height="500" fill="url(#cssGrad)"/>
  <rect width="800" height="500" fill="url(#diag)" opacity="0.3"/>

  <!-- Main Card -->
  <rect x="50" y="40" width="700" height="420" rx="12" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1.5"/>

  <!-- Top bar -->
  <rect x="50" y="40" width="700" height="48" rx="12" fill="#F8FAFC"/>
  <line x1="50" y1="88" x2="750" y2="88" stroke="#E2E8F0" stroke-width="1"/>
  <text x="80" y="70" font-family="monospace" font-size="12" font-weight="600" fill="#0F172A">CSS FOUNDATIONS // BOX MODEL, SELECTORS &amp; LAYOUT ARCHITECTURE</text>
  <rect x="620" y="55" width="105" height="20" rx="4" fill="#ECFDF5" stroke="#A7F3D0" stroke-width="1"/>
  <text x="672" y="69" font-family="monospace" font-size="10" font-weight="600" fill="#059669" text-anchor="middle">VERIFIED DEMO</text>

  <!-- Left: CSS Box Model Interactive Visualizer -->
  <g transform="translate(90, 120)">
    <!-- Margin -->
    <rect x="0" y="0" width="280" height="280" rx="8" fill="#FEF3C7" stroke="#F59E0B" stroke-width="1.5" stroke-dasharray="4,4"/>
    <text x="15" y="24" font-family="monospace" font-size="11" font-weight="600" fill="#B45309">MARGIN (32px)</text>
    
    <!-- Border -->
    <rect x="25" y="35" width="230" height="210" rx="6" fill="#FDE68A" stroke="#D97706" stroke-width="1.5"/>
    <text x="40" y="58" font-family="monospace" font-size="11" font-weight="600" fill="#92400E">BORDER (2px solid)</text>

    <!-- Padding -->
    <rect x="50" y="70" width="180" height="140" rx="4" fill="#DBEAFE" stroke="#3B82F6" stroke-width="1.5"/>
    <text x="65" y="93" font-family="monospace" font-size="11" font-weight="600" fill="#1E40AF">PADDING (24px)</text>

    <!-- Content -->
    <rect x="75" y="105" width="130" height="70" rx="4" fill="#2563EB"/>
    <text x="140" y="145" font-family="monospace" font-size="12" font-weight="700" fill="#FFFFFF" text-anchor="middle">CONTENT BOX</text>
  </g>

  <!-- Right: Code & Layout Specifications -->
  <g transform="translate(420, 120)">
    <rect x="0" y="0" width="290" height="280" rx="8" fill="#0F172A"/>
    
    <!-- Editor Header -->
    <rect x="0" y="0" width="290" height="32" rx="8" fill="#1E293B"/>
    <circle cx="20" cy="16" r="4" fill="#EF4444"/>
    <circle cx="34" cy="16" r="4" fill="#F59E0B"/>
    <circle cx="48" cy="16" r="4" fill="#10B981"/>
    <text x="75" y="20" font-family="monospace" font-size="10" fill="#94A3B8">styles/architecture.css</text>

    <text x="20" y="60" font-family="monospace" font-size="11" fill="#38BDF8">.responsive-container {</text>
    <text x="35" y="82" font-family="monospace" font-size="11" fill="#F1F5F9">display: <tspan fill="#F59E0B">grid</tspan>;</text>
    <text x="35" y="104" font-family="monospace" font-size="11" fill="#F1F5F9">grid-template-columns: <tspan fill="#F59E0B">repeat(auto-fit, minmax(280px, 1fr))</tspan>;</text>
    <text x="35" y="126" font-family="monospace" font-size="11" fill="#F1F5F9">gap: <tspan fill="#F59E0B">1.75rem</tspan>;</text>
    <text x="35" y="148" font-family="monospace" font-size="11" fill="#F1F5F9">box-sizing: <tspan fill="#F59E0B">border-box</tspan>;</text>
    <text x="20" y="170" font-family="monospace" font-size="11" fill="#38BDF8">}</text>

    <line x1="20" y1="185" x2="270" y2="185" stroke="#334155" stroke-width="1"/>

    <text x="20" y="210" font-family="monospace" font-size="10" fill="#64748B">/* Core Focus */</text>
    <text x="20" y="230" font-family="monospace" font-size="11" fill="#4ADE80">// Specificity management</text>
    <text x="20" y="250" font-family="monospace" font-size="11" fill="#4ADE80">// Semantic pseudo-selectors</text>
    <text x="20" y="270" font-family="monospace" font-size="11" fill="#4ADE80">// CSS Custom Properties / Tokens</text>
  </g>
</svg>

