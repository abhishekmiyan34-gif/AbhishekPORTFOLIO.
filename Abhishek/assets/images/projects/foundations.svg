<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <defs>
    <linearGradient id="foundGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F8FAFC"/>
      <stop offset="100%" stop-color="#F1F5F9"/>
    </linearGradient>
  </defs>

  <rect width="800" height="500" fill="url(#foundGrad)"/>

  <!-- Left: DOM Tree Semantic Structure -->
  <g transform="translate(60, 50)">
    <rect width="320" height="400" rx="10" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1.5"/>
    <rect width="320" height="40" rx="10" fill="#F8FAFC"/>
    <line x1="0" y1="40" x2="320" y2="40" stroke="#E2E8F0" stroke-width="1"/>
    <text x="20" y="25" font-family="monospace" font-size="11" font-weight="600" fill="#0F172A">SEMANTIC DOM TREE // HTML5</text>

    <!-- Node Tree -->
    <g transform="translate(25, 70)">
      <rect x="0" y="0" width="110" height="26" rx="4" fill="#EFF6FF" stroke="#3B82F6" stroke-width="1"/>
      <text x="55" y="17" font-family="monospace" font-size="11" fill="#1E40AF" text-anchor="middle">&lt;header&gt;</text>

      <line x1="55" y1="26" x2="55" y2="55" stroke="#CBD5E1" stroke-width="1.5"/>
      <line x1="55" y1="55" x2="120" y2="55" stroke="#CBD5E1" stroke-width="1.5"/>

      <rect x="120" y="42" width="120" height="26" rx="4" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1"/>
      <text x="180" y="59" font-family="monospace" font-size="11" fill="#475569" text-anchor="middle">&lt;nav&gt; links</text>

      <!-- Main Branch -->
      <rect x="0" y="100" width="110" height="26" rx="4" fill="#EFF6FF" stroke="#3B82F6" stroke-width="1"/>
      <text x="55" y="117" font-family="monospace" font-size="11" fill="#1E40AF" text-anchor="middle">&lt;main&gt;</text>

      <line x1="55" y1="126" x2="55" y2="160" stroke="#CBD5E1" stroke-width="1.5"/>
      <line x1="55" y1="160" x2="120" y2="160" stroke="#CBD5E1" stroke-width="1.5"/>

      <rect x="120" y="147" width="140" height="26" rx="4" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1"/>
      <text x="190" y="164" font-family="monospace" font-size="11" fill="#475569" text-anchor="middle">&lt;section&gt; article</text>

      <!-- Section details -->
      <line x1="190" y1="173" x2="190" y2="205" stroke="#CBD5E1" stroke-width="1.5"/>
      <rect x="140" y="205" width="110" height="24" rx="4" fill="#F1F5F9"/>
      <text x="195" y="221" font-family="monospace" font-size="10" fill="#64748B" text-anchor="middle">&lt;figure&gt; &amp; data</text>

      <!-- Footer Branch -->
      <rect x="0" y="260" width="110" height="26" rx="4" fill="#EFF6FF" stroke="#3B82F6" stroke-width="1"/>
      <text x="55" y="277" font-family="monospace" font-size="11" fill="#1E40AF" text-anchor="middle">&lt;footer&gt;</text>
    </g>
  </g>

  <!-- Right: Practice Labs Summary -->
  <g transform="translate(420, 50)">
    <rect width="320" height="400" rx="10" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1.5"/>
    <rect width="320" height="40" rx="10" fill="#F8FAFC"/>
    <line x1="0" y1="40" x2="320" y2="40" stroke="#E2E8F0" stroke-width="1"/>
    <text x="20" y="25" font-family="monospace" font-size="11" font-weight="600" fill="#0F172A">B.TECH YEAR 1 FOUNDATIONAL LABS</text>

    <g transform="translate(20, 65)">
      <!-- Item 1: ResumeDemo -->
      <rect width="280" height="90" rx="6" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1"/>
      <text x="15" y="25" font-family="sans-serif" font-size="13" font-weight="700" fill="#0F172A">ResumeDemo</text>
      <text x="15" y="45" font-family="sans-serif" font-size="11" fill="#64748B">Semantic markup hierarchy &amp; structural tags.</text>
      <rect x="15" y="58" width="55" height="18" rx="3" fill="#EFF6FF"/>
      <text x="42" y="71" font-family="monospace" font-size="9" fill="#2563EB" text-anchor="middle">HTML5</text>
      <text x="85" y="71" font-family="monospace" font-size="10" fill="#94A3B8">// First Year Milestone</text>

      <!-- Item 2: LaundryWallah -->
      <g transform="translate(0, 105)">
        <rect width="280" height="90" rx="6" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1"/>
        <text x="15" y="25" font-family="sans-serif" font-size="13" font-weight="700" fill="#0F172A">LaundryWallah Landing Demo</text>
        <text x="15" y="45" font-family="sans-serif" font-size="11" fill="#64748B">Single-page service UI with semantic forms.</text>
        <rect x="15" y="58" width="55" height="18" rx="3" fill="#EFF6FF"/>
        <text x="42" y="71" font-family="monospace" font-size="9" fill="#2563EB" text-anchor="middle">HTML5</text>
        <text x="85" y="71" font-family="monospace" font-size="10" fill="#94A3B8">// Form Elements &amp; Layout</text>
      </g>

      <!-- Item 3: AboutEarth -->
      <g transform="translate(0, 210)">
        <rect width="280" height="90" rx="6" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1"/>
        <text x="15" y="25" font-family="sans-serif" font-size="13" font-weight="700" fill="#0F172A">AboutEarth Educational Page</text>
        <text x="15" y="45" font-family="sans-serif" font-size="11" fill="#64748B">Rich document structure, media embeddings &amp; typography.</text>
        <rect x="15" y="58" width="55" height="18" rx="3" fill="#EFF6FF"/>
        <text x="42" y="71" font-family="monospace" font-size="9" fill="#2563EB" text-anchor="middle">HTML5</text>
        <text x="85" y="71" font-family="monospace" font-size="10" fill="#94A3B8">// Accessible Web</text>
      </g>
    </g>
